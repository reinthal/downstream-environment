[project]
name = "linear-probes"
version = "0.1.0"
description = "Minimal linear-probe training on residual-stream activations, local or NDIF"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "scikit-learn",
]

[project.optional-dependencies]
local = ["torch", "transformers", "peft", "accelerate"]
ndif = ["torch", "transformers", "nnsight"]

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
    "pytest",
]

# box driver is CUDA 12.2 (535.x) — default PyPI torch ships cu130 wheels that refuse it
[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["linear_probes", "rollouts"]
