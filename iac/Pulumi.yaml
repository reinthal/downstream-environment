name: modal-iac
description: Modal volumes and secret for experiments/2026-10-13-fibs-basharena
runtime:
  name: python
  options:
    toolchain: uv
# State lives IN the repo (iac/state/, git-tracked): single-operator stack,
# no secrets in state (HF_TOKEN is read from env at operation time).
# Commit after every `pulumi up`; pull before running from another clone.
backend:
  url: file://./state
