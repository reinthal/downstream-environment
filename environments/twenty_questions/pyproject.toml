[project]
name = "twenty-questions-env"
version = "0.1.0"
description = "Twenty Questions as a social-deduction environment: a suspect commits a secret, an auditor asks yes/no questions (Inspect, OpenRouter / local vLLM)"
requires-python = ">=3.12"
dependencies = [
    "inspect-ai>=0.3.277",
    "matplotlib>=3.11.2",
    "openai>=3.26.0",
    "pyyaml>=6.0",
    "typesafe-sdk>=0.7.5",
]

[dependency-groups]
dev = ["pytest>=8"]

# Intentionally separate from the repo-root pyproject (linear-probe deps:
# torch/transformers). See CLAUDE.md in this directory.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["twenty_questions"]
