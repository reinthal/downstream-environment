# Posterior-entropy calculator (twenty_questions.entropy), scored with
# TypeSafe's Jev: every auditor question is evaluated against every THINGS
# concept (one Noul per concept: "if the secret were c, is the answer yes?"),
# and the posterior over THINGS gives the bits each question removed.
# {concept} / {definition} are filled per concept; `question` is the state.

model: jev-1.13.0
concept_set: concepts/things_all.json
prior: uniform
noul_instructions: |-
  In a game of Twenty Questions the secret is "{concept}" ({definition}). Is the truthful answer to `question` yes?
noul_criteria:
  'true': |-
    For this secret, someone who knows it would truthfully answer the question yes.
  'false': |-
    For this secret, someone who knows it would truthfully answer the question no.
concepts_per_request: 300
concurrency: 8
